actions:
  menu_button:  Menu
  pause:        Pause
  resume:       Resume
  reboot:       Reset
  poweroff:     Power off

network:
  searching:  Searching the network for a C64 Ultimate...
  waiting:    Waiting for the C64 Ultimate...
  password-required:  The C64 Ultimate requires a password
  blocked-title:        No stream data
  blocked-windows:      The C64 Ultimate accepted the stream request, but no data is arriving. Windows Firewall is most likely blocking ultraView. Click "Change settings" in the firewall panel, then tick the checkbox next to ultraView.
  blocked-mac:          The C64 Ultimate accepted the stream request, but no data is arriving. Please allow ultraView under Local Network in the system privacy settings.
  blocked-open-windows: Open Firewall Settings
  blocked-open-mac:     Open System Settings
  blocked-close:        Close

# The crt/settings strings live in UI/strings/crt-settings.yml (configure-synced
# from the ultra-shared submodule); Strings appends them to this file

# Browser (ultraView-only part of the CRT page)
crt:
  settings:
    browse:
      header: Browse CRT & PRG
      password: C64 Ultimate password (optional)

# Keyboard shortcuts dialog; the labels are keyed by the verbs in
# Data/UI/shortcuts.csv
shortcuts:
  title: Keyboard Shortcuts
  hint:  Press {} to toggle this dialog.
  or:    or

  section:
    machine:    Machine
    view:       View
    navigation: Navigation

  machine:
    toggleMenu:       Ultimate menu
    togglePause:      Pause / resume
    resetMachine:     Reset

  view:
    toggleBrowser:    Browser panel
    toggleSettings:   CRT settings
    toggleFullscreen: Fullscreen
    toggleRasterTime: Raster time display

  navigation:
    focusSearch:      Search
    showShortcuts:    Keyboard shortcuts
