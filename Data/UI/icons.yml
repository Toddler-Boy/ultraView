actions:
  menu_button:  bars-solid-full
  pause:        pause-solid-full
  resume:       play-solid-full
  reboot:       arrow-rotate-left-solid-full
  poweroff:     power-off-solid-full

browser:
  path: folder-open-solid-full
  password_show: tabler/eye
  password_hide: tabler/eye-off

crt:
  browser_open:   browse-games
  browser_close:  browse-games

  settings_open:  sliders-solid-full
  settings_close: sliders-solid-full

  about_open:     info-solid-full

  settings:
    tv:
      brightness:  crt/brightness
      contrast:    crt/contrast
      saturation:  crt/saturation
      overscan:    crt/overscan

    webcam:
      brightness:  crt/brightness
      contrast:    crt/contrast
      saturation:  crt/saturation
      zoom:        magnifying-glass-solid-full

about:
  close: xmark-solid-full

delete: xmark-solid-full

# Factory vs user rows in the theme / overlay / mask pick lists
theme-factory: dice-d6-solid-full
theme-user:    user-solid-full
crt-factory:   dice-d6-solid-full
crt-user:      user-solid-full

# Look-and-feel primitives
laf:
  combo_arrow:   angle-down-solid-full
  check:         check-solid-full
  submenu_arrow: chevron-right-solid-full
